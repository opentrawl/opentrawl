syntax = "proto3";

package trawl.twitter.open;

import "google/protobuf/timestamp.proto";
import "trawl/identity/identity.proto";

option go_package = "github.com/opentrawl/opentrawl/twitter/proto/trawl/twitter/open;twitteropen";

message OpenedTwitterPostRecord {
  trawl.identity.CanonicalArchiveRecordReference canonical_twitter_post_record_reference = 1;
  OpenedTwitterPost opened_twitter_post = 2;
  repeated OpenedTwitterPost ancestor_twitter_posts_in_oldest_first_order = 3;
  repeated OpenedTwitterPost reply_twitter_posts_in_oldest_first_order = 4;
  bool earlier_ancestor_twitter_posts_are_omitted = 5;
  bool later_reply_twitter_posts_are_omitted = 6;
}

message OpenedTwitterPost {
  trawl.identity.CanonicalArchiveRecordReference canonical_twitter_post_record_reference = 1;
  google.protobuf.Timestamp twitter_post_created_time = 2;
  optional string twitter_post_author_display_name = 3;
  string twitter_post_text = 4;
  trawl.identity.CanonicalArchiveRecordReference replied_to_twitter_post_record_reference = 5;
  optional int64 twitter_post_like_count = 6;
  optional int64 twitter_post_repost_count = 7;
  optional int64 twitter_post_reply_count = 8;
  google.protobuf.Timestamp twitter_post_counts_observed_time = 9;
  optional string twitter_post_availability_note = 10;
  optional bool twitter_post_is_unavailable = 11;
  optional string twitter_conversation_identifier = 12;
  optional string quoted_twitter_post_identifier = 13;
}
