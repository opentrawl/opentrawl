syntax = "proto3";

package trawl.photos.open;

option go_package = "github.com/opentrawl/opentrawl/trawlers/photos/proto/trawl/photos/open;photosopen";

message OpenedPhotoRecord {
  string ref = 2;
  OpenedPhotoOutdatedDerivedDetails stale = 3;
  OpenedPhotoSourceFacts mechanical = 4;
  OpenedPhotoModelDerivedDetails model = 5;
}

message OpenedPhotoOutdatedDerivedDetails {
  string since = 1;
  string reason = 2;
  string banner = 3;
}

message OpenedPhotoSourceFacts {
  OpenedPhotoSourceAvailability source = 1;
  OpenedPhotoCaptureTime captured = 2;
  OpenedPhotoMediaDetails media = 3;
  OpenedPhotoPlace place = 4;
  OpenedPhotoGlobalPositioningSystemCoordinates gps = 5;
  optional string address = 6;
  OpenedPhotoMatchedKnownPlace known_place = 7;
  OpenedPhotoMatchedVenue venue = 8;
  repeated OpenedPhotoVenueCandidate venue_candidates = 9;
  OpenedPhotoCameraDetails camera = 10;
  repeated OpenedPhotoAlbumMembership albums = 11;
  OpenedPhotoOriginalAssetDetails original = 12;
  repeated string flags = 13;
}

message OpenedPhotoSourceAvailability {
  string state = 1;
  optional string first_missing_at = 2;
  optional string source_deleted_at = 3;
}

message OpenedPhotoCaptureTime {
  string local = 1;
  optional string timezone = 2;
}

message OpenedPhotoMediaDetails {
  optional string kind = 1;
  optional int64 width = 2;
  optional int64 height = 3;
  optional double duration_seconds = 4;
}

message OpenedPhotoPlace {
  optional string name = 1;
  optional double latitude = 2;
  optional double longitude = 3;
}

message OpenedPhotoGlobalPositioningSystemCoordinates {
  double latitude = 1;
  double longitude = 2;
  optional double horizontal_accuracy_meters = 3;
}

message OpenedPhotoMatchedKnownPlace {
  string kind = 1;
  string name = 2;
  optional bool after = 3;
}

message OpenedPhotoMatchedVenue {
  string name = 1;
  optional string category = 2;
  string tier = 3;
  optional double distance_meters = 4;
}

message OpenedPhotoVenueCandidate {
  string name = 1;
  optional string category = 2;
  optional string tier = 3;
  optional double distance_meters = 4;
}

message OpenedPhotoCameraDetails {
  optional string display = 1;
  optional string make = 2;
  optional string model = 3;
  optional string lens_model = 4;
  optional double focal_length_mm = 5;
  optional double focal_length_35mm = 6;
  optional double aperture = 7;
  optional string shutter_speed = 8;
  optional int64 iso = 9;
}

message OpenedPhotoAlbumMembership {
  string title = 1;
}

message OpenedPhotoOriginalAssetDetails {
  optional string filename = 1;
  optional int64 bytes = 2;
  optional string availability = 3;
}

message OpenedPhotoModelDerivedDetails {
  optional string prompt_version = 1;
  optional string model_id = 2;
  optional string summary = 3;
  optional string description = 4;
  optional string ocr_text = 5;
  repeated string uncertainties = 6;
  optional string visible_text = 7;
  OpenedPhotoModelDerivedLocation location = 8;
}

message OpenedPhotoModelDerivedLocation {
  optional string name = 1;
  string kind = 2;
  string confidence = 3;
  string reason = 4;
}
