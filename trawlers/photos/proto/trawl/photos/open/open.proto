syntax = "proto3";

package trawl.photos.open;

import "google/protobuf/timestamp.proto";
import "trawl/identity/identity.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlers/photos/proto/trawl/photos/open;photosopen";

message OpenedPhotoRecord {
  trawl.identity.CanonicalArchiveRecordReference canonical_photo_record_reference = 1;
  OpenedPhotoOutdatedDerivedDetails outdated_derived_details = 2;
  OpenedPhotoSourceFacts photo_source_facts = 3;
}

message OpenedPhotoOutdatedDerivedDetails {
  google.protobuf.Timestamp derived_details_became_outdated_time = 1;
  string reason_derived_details_are_outdated = 2;
  string outdated_derived_details_human_description = 3;
}

message OpenedPhotoSourceFacts {
  OpenedPhotoSourceAvailability photo_source_availability = 1;
  OpenedPhotoCaptureTime photo_capture_time = 2;
  OpenedPhotoMediaDetails photo_media_details = 3;
  OpenedPhotoPlace photo_place = 4;
  OpenedPhotoGlobalPositioningSystemCoordinates photo_global_positioning_system_coordinates = 5;
  optional string photo_postal_address = 6;
  OpenedPhotoMatchedKnownPlace matched_known_place = 7;
  OpenedPhotoMatchedVenue matched_venue = 8;
  repeated OpenedPhotoVenueCandidate venue_candidates_in_nearest_first_order = 9;
  OpenedPhotoCameraDetails photo_camera_details = 10;
  repeated OpenedPhotoAlbumMembership photo_album_memberships = 11;
  OpenedPhotoOriginalAssetDetails original_photo_asset_details = 12;
  repeated string photo_source_fact_flags = 13;
}

message OpenedPhotoSourceAvailability {
  OpenedPhotoSourceAvailabilityState photo_source_availability_state = 1;
  google.protobuf.Timestamp photo_source_first_missing_time = 2;
  google.protobuf.Timestamp photo_source_deleted_time = 3;
}

enum OpenedPhotoSourceAvailabilityState {
  OPENED_PHOTO_SOURCE_AVAILABILITY_STATE_UNSPECIFIED = 0;
  OPENED_PHOTO_SOURCE_AVAILABILITY_STATE_CURRENT = 1;
  OPENED_PHOTO_SOURCE_AVAILABILITY_STATE_DELETED_UPSTREAM = 2;
}

message OpenedPhotoCaptureTime {
  google.protobuf.Timestamp photo_capture_time = 1;
  optional string photo_capture_time_zone_identifier = 2;
}

message OpenedPhotoMediaDetails {
  optional string photo_media_kind = 1;
  optional int64 photo_pixel_width = 2;
  optional int64 photo_pixel_height = 3;
  optional double video_duration_seconds = 4;
}

message OpenedPhotoPlace {
  optional string photo_place_display_name = 1;
  optional double photo_place_latitude_degrees = 2;
  optional double photo_place_longitude_degrees = 3;
}

message OpenedPhotoGlobalPositioningSystemCoordinates {
  double latitude_degrees = 1;
  double longitude_degrees = 2;
  optional double horizontal_accuracy_metres = 3;
}

message OpenedPhotoMatchedKnownPlace {
  string known_place_kind = 1;
  string known_place_display_name = 2;
  optional bool capture_time_was_after_configured_period = 3;
}

message OpenedPhotoMatchedVenue {
  string venue_display_name = 1;
  optional string venue_category = 2;
  string venue_match_tier = 3;
  optional double distance_from_photo_coordinates_metres = 4;
}

message OpenedPhotoVenueCandidate {
  string venue_display_name = 1;
  optional string venue_category = 2;
  optional string venue_match_tier = 3;
  optional double distance_from_photo_coordinates_metres = 4;
}

message OpenedPhotoCameraDetails {
  optional string camera_display_name = 1;
  optional string camera_manufacturer_name = 2;
  optional string camera_model_name = 3;
  optional string camera_lens_model_name = 4;
  optional double camera_focal_length_millimetres = 5;
  optional double camera_35_millimetre_equivalent_focal_length = 6;
  optional double camera_aperture_f_number = 7;
  optional string camera_shutter_speed_display_text = 8;
  optional int64 camera_iso_sensitivity = 9;
}

message OpenedPhotoAlbumMembership {
  string photo_album_display_name = 1;
}

message OpenedPhotoOriginalAssetDetails {
  optional string original_photo_asset_filename = 1;
  optional int64 original_photo_asset_byte_count = 2;
  optional string original_photo_asset_availability = 3;
}
