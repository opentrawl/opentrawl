syntax = "proto3";

package opentrawl.photos.location;

option go_package = "github.com/opentrawl/opentrawl/trawlers/photos/proto/opentrawl/photos/location;locationwire";

import "google/protobuf/timestamp.proto";

message Coordinate {
  double latitude = 1;
  double longitude = 2;
}

message CaptureLocationInput {
  string asset_id = 1;
  google.protobuf.Timestamp capture_time = 2;
  Coordinate coordinate = 3;
}

message AddressHierarchy {
  string name = 1;
  string house_number = 2;
  string street = 3;
  string neighbourhood = 4;
  string district = 5;
  string city = 6;
  string county = 7;
  string region = 8;
  string postcode = 9;
  string country = 10;
  string country_code = 11;
  string time_zone = 12;
  repeated NamedArea areas = 13;
  string formatted = 14;
}

message NamedArea {
  NamedAreaKind kind = 1;
  string name = 2;
}

enum NamedAreaKind {
  NAMED_AREA_KIND_UNSPECIFIED = 0;
  NAMED_AREA_KIND_AREA_OF_INTEREST = 1;
  NAMED_AREA_KIND_SUBURB = 2;
  NAMED_AREA_KIND_MUNICIPALITY = 3;
}

message PlaceCandidate {
  int32 provider_position = 1;
  string provider_reference = 2;
  string name = 3;
  repeated string categories = 4;
  Coordinate coordinate = 5;
  double distance_meters = 6;
  AddressHierarchy address = 7;
}

message OperationFailure {
  OperationFailureClass class = 1;
  string detail = 2;
  google.protobuf.Timestamp retry_not_before = 3;
}

enum OperationFailureClass {
  OPERATION_FAILURE_CLASS_UNSPECIFIED = 0;
  OPERATION_FAILURE_CLASS_BUILD_REQUEST = 1;
  OPERATION_FAILURE_CLASS_TRANSPORT = 2;
  OPERATION_FAILURE_CLASS_READ_RESPONSE = 3;
  OPERATION_FAILURE_CLASS_RESPONSE_TOO_LARGE = 4;
  OPERATION_FAILURE_CLASS_HTTP_STATUS = 5;
  OPERATION_FAILURE_CLASS_DECODE_RESPONSE = 6;
  OPERATION_FAILURE_CLASS_APPLE_PROVIDER = 7;
  OPERATION_FAILURE_CLASS_CANDIDATE_LIMIT = 8;
  OPERATION_FAILURE_CLASS_DEPENDENCY_MISMATCH = 9;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_REQUEST_RETAINED = 1;
  OPERATION_STATE_TRANSMISSION_STARTED = 2;
  OPERATION_STATE_RESPONSE_RETAINED = 3;
  OPERATION_STATE_SUCCEEDED = 4;
  OPERATION_STATE_NO_RESULT = 5;
  OPERATION_STATE_FAILED = 6;
  OPERATION_STATE_SKIPPED_KNOWN_PLACE = 7;
}

message ProviderExchange {
  OperationState state = 1;
  bool transmission_started = 2;
  bytes exact_response = 3;
  int32 http_status = 4;
  string provider_request_id = 5;
  OperationFailure failure = 6;
}

enum LocationEvidenceProvider {
  LOCATION_EVIDENCE_PROVIDER_UNSPECIFIED = 0;
  LOCATION_EVIDENCE_PROVIDER_APPLE_CORE_LOCATION = 1;
  LOCATION_EVIDENCE_PROVIDER_APPLE_MAP_KIT = 2;
  LOCATION_EVIDENCE_PROVIDER_GEOAPIFY_PLACES = 3;
}

enum ProviderEvidenceUse {
  PROVIDER_EVIDENCE_USE_UNSPECIFIED = 0;
  PROVIDER_EVIDENCE_USE_ACQUIRED = 1;
  PROVIDER_EVIDENCE_USE_REUSED = 2;
}

message MatchConfiguredKnownPlaceRequest {
  CaptureLocationInput input = 1;
  bytes known_place_configuration_sha256 = 2;
}

message KnownPlaceConfiguration {
  repeated ConfiguredKnownPlace places = 1;
}

message ConfiguredKnownPlace {
  string known_place_id = 1;
  ConfiguredKnownPlaceKind kind = 2;
  string display_name = 3;
  Coordinate coordinate = 4;
  double radius_meters = 5;
  google.protobuf.Timestamp valid_from = 6;
  google.protobuf.Timestamp valid_until = 7;
}

message ConfiguredKnownPlaceMatch {
  string known_place_id = 1;
  ConfiguredKnownPlaceKind kind = 2;
  string display_name = 3;
  double distance_meters = 4;
  google.protobuf.Timestamp valid_from = 5;
  google.protobuf.Timestamp valid_until = 6;
  ConfiguredKnownPlaceRelationshipAtCapture relationship_at_capture = 7;
}

enum ConfiguredKnownPlaceKind {
  CONFIGURED_KNOWN_PLACE_KIND_UNSPECIFIED = 0;
  CONFIGURED_KNOWN_PLACE_KIND_HOME = 1;
  CONFIGURED_KNOWN_PLACE_KIND_FORMER_HOME = 2;
  CONFIGURED_KNOWN_PLACE_KIND_WORK = 3;
}

enum ConfiguredKnownPlaceRelationshipAtCapture {
  CONFIGURED_KNOWN_PLACE_RELATIONSHIP_AT_CAPTURE_UNSPECIFIED = 0;
  CONFIGURED_KNOWN_PLACE_RELATIONSHIP_AT_CAPTURE_ACTIVE_DURING_KNOWN_PERIOD = 1;
  CONFIGURED_KNOWN_PLACE_RELATIONSHIP_AT_CAPTURE_VISITED_AFTER_KNOWN_PERIOD = 2;
}

message MatchConfiguredKnownPlaceOutcome {
  MatchConfiguredKnownPlaceRequest request = 1;
  repeated ConfiguredKnownPlaceMatch matches = 2;
  OperationState state = 3;
  OperationFailure failure = 4;
  google.protobuf.Timestamp completed_at = 5;
}

message AcquireAppleReverseGeocodingEvidenceRequest {
  CaptureLocationInput input = 1;
  AppleReverseGeocodingProviderRequest provider_request = 2;
}

message AppleReverseGeocodingProviderRequest {
  Coordinate coordinate = 1;
}

message AcquireAppleReverseGeocodingEvidenceOutcome {
  AcquireAppleReverseGeocodingEvidenceRequest request = 1;
  ProviderExchange exchange = 2;
  AddressHierarchy address = 3;
  google.protobuf.Timestamp completed_at = 4;
  LocationEvidenceProvider provider = 5;
  ProviderEvidenceUse evidence_use = 6;
  google.protobuf.Timestamp observed_at = 7;
  repeated LocationEvidenceAttribution attributions = 8;
}

message AcquireAppleNearbyPlaceEvidenceRequest {
  CaptureLocationInput input = 1;
  AppleNearbyPlaceProviderRequest provider_request = 2;
}

message AppleNearbyPlaceProviderRequest {
  Coordinate coordinate = 1;
  double radius_meters = 2;
  int32 maximum_candidates = 3;
}

message AcquireAppleNearbyPlaceEvidenceOutcome {
  AcquireAppleNearbyPlaceEvidenceRequest request = 1;
  ProviderExchange exchange = 2;
  repeated PlaceCandidate candidates = 3;
  google.protobuf.Timestamp completed_at = 4;
  LocationEvidenceProvider provider = 5;
  ProviderEvidenceUse evidence_use = 6;
  google.protobuf.Timestamp observed_at = 7;
  repeated LocationEvidenceAttribution attributions = 8;
}

message AcquireGeoapifyPhotographedPlaceCandidateEvidenceRequest {
  CaptureLocationInput input = 1;
  GeoapifyPlacesProviderRequest provider_request = 2;
}

message GeoapifyPlacesProviderRequest {
  Coordinate coordinate = 1;
  double radius_meters = 2;
  int32 maximum_candidates = 3;
  repeated string provider_categories = 4;
  bool require_named_candidates = 6;
}

message AcquireGeoapifyPhotographedPlaceCandidateEvidenceOutcome {
  AcquireGeoapifyPhotographedPlaceCandidateEvidenceRequest request = 1;
  ProviderExchange exchange = 2;
  repeated PlaceCandidate candidates = 3;
  google.protobuf.Timestamp completed_at = 4;
  LocationEvidenceProvider provider = 5;
  ProviderEvidenceUse evidence_use = 6;
  google.protobuf.Timestamp observed_at = 7;
  repeated LocationEvidenceAttribution attributions = 8;
}

message ComposePhotoLocationEvidenceRequest {
  string asset_id = 1;
  bytes known_place_outcome_sha256 = 2;
  bytes apple_reverse_outcome_sha256 = 3;
  bytes apple_nearby_outcome_sha256 = 4;
  bytes geoapify_photographed_place_candidate_evidence_outcome_sha256 = 5;
}

message ComposePhotoLocationEvidenceOutcome {
  ComposePhotoLocationEvidenceRequest request = 1;
  OperationState state = 2;
  PhotoLocationBriefing briefing = 3;
  google.protobuf.Timestamp completed_at = 4;
}

message PhotoLocationBriefing {
  CaptureLocationInput capture_location = 1;
  repeated ConfiguredKnownPlaceMatch known_place_matches = 2;
  bool nearby_candidates_suppressed_for_known_place = 3;
  AddressHierarchy apple_camera_location = 4;
  repeated PhotoLocationProviderEvidence provider_evidence = 5;
  PhotoLocationCandidateSelection candidate_selection = 6;
}

message PhotoLocationProviderEvidence {
  LocationEvidenceProvider provider = 1;
  LocationOperationTerminalStatus terminal_status = 2;
  ProviderEvidenceUse evidence_use = 3;
  google.protobuf.Timestamp observed_at = 4;
  repeated LocationEvidenceAttribution attributions = 5;
  repeated PhotoLocationBriefingCandidate candidates_in_provider_order = 6;
}

message LocationEvidenceAttribution {
  string provider_name = 1;
  string data_source_name = 2;
  string data_source_credit = 3;
  string data_source_license = 4;
  string data_source_url = 5;
}

message PhotoLocationBriefingCandidate {
  PhotoLocationCandidateReference reference = 1;
  PlaceCandidate retained_provider_candidate = 2;
}

message PhotoLocationCandidateReference {
  LocationEvidenceProvider provider = 1;
  int32 zero_based_provider_position = 2;
}

message PhotoLocationCandidateSelection {
  PhotoLocationCandidateSelectionMethod method = 1;
  PhotoLocationDecisionAuthority authority = 2;
}

enum PhotoLocationCandidateSelectionMethod {
  PHOTO_LOCATION_CANDIDATE_SELECTION_METHOD_UNSPECIFIED = 0;
  PHOTO_LOCATION_CANDIDATE_SELECTION_METHOD_ALL_RETAINED_IN_PROVIDER_ORDER = 1;
}

enum PhotoLocationDecisionAuthority {
  PHOTO_LOCATION_DECISION_AUTHORITY_UNSPECIFIED = 0;
  PHOTO_LOCATION_DECISION_AUTHORITY_MODEL_HYPOTHESIS = 1;
}

message LocationOperationTerminalStatus {
  OperationState state = 1;
  OperationFailure failure = 2;
}
