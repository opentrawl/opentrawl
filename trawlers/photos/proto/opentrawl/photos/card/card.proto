syntax = "proto3";

package opentrawl.photos.card;

option go_package = "github.com/opentrawl/opentrawl/trawlers/photos/proto/opentrawl/photos/card;cardwire";

// PhotoCard is OpenTrawl's typed account of the current rendered photo.
// Code composes it from Luna's typed OCR and semantic responses. Capture facts
// and provider location evidence remain independent stored inputs.
message PhotoCard {
  PhotoDescriptions descriptions = 1;
  PrimaryDepictedSubject primary_depicted_subject = 2;
  VisiblePhotoContent visible_content = 3;
  PhotoOpticalCharacterRecognition optical_character_recognition = 4;
  PhotographedPlaceJudgement photographed_place = 5;
  repeated string searchable_facts = 6;
  repeated PhotoCardUncertainty uncertainties = 7;
}

// PhotoCardSemanticSections is Luna's second-stage judgement after first-pass
// literal visible text has been retained. It includes an explicit visual OCR
// verification or correction patch. OpenTrawl applies that patch and combines
// these fields with the corrected OCR to form one PhotoCard.
message PhotoCardSemanticSections {
  PhotoDescriptions descriptions = 1;
  PrimaryDepictedSubject primary_depicted_subject = 2;
  VisiblePhotoContent visible_content = 3;
  SemanticPhotographedPlaceJudgement photographed_place = 4;
  repeated string searchable_facts = 5;
  repeated PhotoCardUncertainty uncertainties = 6;
  PhotoOpticalCharacterRecognitionVerification optical_character_recognition_verification = 7;
}

// PhotoOpticalCharacterRecognitionVerification is Luna's explicit visual
// check of the retained first-stage OCR. Corrections address that exact input;
// code validates and applies them without interpreting text.
message PhotoOpticalCharacterRecognitionVerification {
  PhotoOpticalCharacterRecognitionVerificationState state = 1;
  repeated OpticalCharacterRecognitionLineReplacement line_replacements = 2;
  repeated OpticalCharacterRecognitionLineRemoval line_removals = 3;
  repeated OpticalCharacterRecognitionLineInsertion line_insertions = 4;
  repeated OpticalCharacterRecognitionRegionInsertion region_insertions = 5;
}

enum PhotoOpticalCharacterRecognitionVerificationState {
  PHOTO_OPTICAL_CHARACTER_RECOGNITION_VERIFICATION_STATE_UNSPECIFIED = 0;
  PHOTO_OPTICAL_CHARACTER_RECOGNITION_VERIFICATION_STATE_VERIFIED = 1;
  PHOTO_OPTICAL_CHARACTER_RECOGNITION_VERIFICATION_STATE_CORRECTED = 2;
}

message OpticalCharacterRecognitionLineReplacement {
  uint32 retained_region_index = 1;
  uint32 retained_line_index = 2;
  string expected_retained_text = 3;
  OpticalCharacterRecognitionLine replacement_line = 4;
}

message OpticalCharacterRecognitionLineRemoval {
  uint32 retained_region_index = 1;
  uint32 retained_line_index = 2;
  string expected_retained_text = 3;
}

message OpticalCharacterRecognitionLineInsertion {
  uint32 retained_region_index = 1;
  uint32 insert_after_retained_line_index = 2;
  repeated OpticalCharacterRecognitionLine inserted_lines_in_reading_order = 3;
}

message OpticalCharacterRecognitionRegionInsertion {
  uint32 insert_after_retained_region_index = 1;
  repeated OpticalCharacterRecognitionRegion inserted_regions_in_reading_order = 2;
}

message PhotoDescriptions {
  string concise_description = 1;
  string detailed_description = 2;
}

// PrimaryDepictedSubject stores the subject a person would say the photo is of.
// It deliberately uses human language instead of a closed subject ontology.
message PrimaryDepictedSubject {
  string human_name = 1;
  string visual_evidence = 2;
}

message VisiblePhotoContent {
  string scene = 1;
  repeated VisiblePerson people = 2;
  repeated string important_objects = 3;
  repeated string visible_actions = 4;
}

message VisiblePerson {
  string visible_position_or_role = 1;
  string visible_appearance = 2;
  string visible_action_or_pose = 3;
}

message PhotoOpticalCharacterRecognition {
  repeated OpticalCharacterRecognitionRegion regions_in_reading_order = 1;
  repeated OpticalCharacterRecognitionKeyValue key_value_fields = 2;
  repeated OpticalCharacterRecognitionTable tables = 3;
  repeated OpticalCharacterRecognitionUncertainty uncertainties = 4;
}

message OpticalCharacterRecognitionRegion {
  string visible_source = 1;
  repeated OpticalCharacterRecognitionLine lines_in_reading_order = 2;
}

message OpticalCharacterRecognitionLine {
  string transcribed_text = 1;
  repeated string languages = 2;
  OpticalCharacterRecognitionLegibility legibility = 3;
}

enum OpticalCharacterRecognitionLegibility {
  OPTICAL_CHARACTER_RECOGNITION_LEGIBILITY_UNSPECIFIED = 0;
  OPTICAL_CHARACTER_RECOGNITION_LEGIBILITY_CLEAR = 1;
  OPTICAL_CHARACTER_RECOGNITION_LEGIBILITY_PARTIAL = 2;
  OPTICAL_CHARACTER_RECOGNITION_LEGIBILITY_UNCLEAR = 3;
}

message OpticalCharacterRecognitionKeyValue {
  string key = 1;
  string value = 2;
  string visible_source = 3;
}

message OpticalCharacterRecognitionTable {
  string visible_source = 1;
  repeated OpticalCharacterRecognitionTableRow rows_in_reading_order = 2;
}

message OpticalCharacterRecognitionTableRow {
  repeated string cells_in_reading_order = 1;
}

message OpticalCharacterRecognitionUncertainty {
  string visible_source = 1;
  string explanation = 2;
}

message PhotographedPlaceJudgement {
  PhotographedPlaceCertainty certainty = 1;
  repeated SuppliedPhotographedPlaceCandidate selected_supplied_candidates = 2;
  repeated ImageInferredPhotographedPlace image_inferred_places = 3;
  string explanation = 4;
}

// SemanticPhotographedPlaceJudgement contains only Luna's place judgement.
// OpenTrawl resolves each supplied identifier to its canonical human name when
// composing the stored PhotographedPlaceJudgement.
message SemanticPhotographedPlaceJudgement {
  PhotographedPlaceCertainty certainty = 1;
  repeated SuppliedPhotographedPlaceSelection selected_supplied_candidates = 2;
  repeated ImageInferredPhotographedPlace image_inferred_places = 3;
  string explanation = 4;
}

enum PhotographedPlaceCertainty {
  PHOTOGRAPHED_PLACE_CERTAINTY_UNSPECIFIED = 0;
  PHOTOGRAPHED_PLACE_CERTAINTY_IDENTIFIED = 1;
  PHOTOGRAPHED_PLACE_CERTAINTY_POSSIBLE = 2;
  PHOTOGRAPHED_PLACE_CERTAINTY_UNKNOWN = 3;
}

message SuppliedPhotographedPlaceCandidate {
  string supplied_candidate_identifier = 1;
  string human_name = 2;
  string evidence = 3;
}

message SuppliedPhotographedPlaceSelection {
  string supplied_candidate_identifier = 1;
  string evidence = 2;
}

message ImageInferredPhotographedPlace {
  string human_name = 1;
  string evidence = 2;
}

message PhotoCardUncertainty {
  PhotoCardUncertaintyScope scope = 1;
  string subject = 2;
  string explanation = 3;
}

enum PhotoCardUncertaintyScope {
  PHOTO_CARD_UNCERTAINTY_SCOPE_UNSPECIFIED = 0;
  PHOTO_CARD_UNCERTAINTY_SCOPE_DESCRIPTION = 1;
  PHOTO_CARD_UNCERTAINTY_SCOPE_VISIBLE_CONTENT = 2;
  PHOTO_CARD_UNCERTAINTY_SCOPE_OPTICAL_CHARACTER_RECOGNITION = 3;
  PHOTO_CARD_UNCERTAINTY_SCOPE_PHOTOGRAPHED_PLACE = 4;
}
