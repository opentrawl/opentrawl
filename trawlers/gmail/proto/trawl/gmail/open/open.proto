syntax = "proto3";

package trawl.gmail.open;

option go_package = "github.com/opentrawl/opentrawl/gmail/proto/trawl/gmail/open;gmailopen";

message OpenedGmailMessageRecord {
  string ref = 1;
  string id = 2;
  string thread_id = 3;
  string time = 4;
  OpenedGmailMessageHeaders headers = 5;
  repeated string labels = 6;
  bool unread = 7;
  repeated OpenedGmailMessageAttachment attachments = 8;
  string body = 9;
  bool body_truncated = 10;
  optional int64 body_elided_chars = 11;
}

message OpenedGmailMessageHeaders {
  optional string from_name = 1;
  optional string from_address = 2;
  string to_address = 3;
  optional string cc_address = 4;
  string subject = 5;
}

message OpenedGmailMessageAttachment {
  string filename = 1;
  string mime_type = 2;
  int64 size = 3;
}
