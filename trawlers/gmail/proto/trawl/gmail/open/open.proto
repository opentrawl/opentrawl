syntax = "proto3";

package trawl.gmail.open;

option go_package = "github.com/opentrawl/opentrawl/gmail/proto/trawl/gmail/open;gmailopen";

message OpenedGmailMessageRecord {
  string canonical_gmail_message_record_reference = 1;
  string gmail_message_identifier = 2;
  string gmail_thread_identifier = 3;
  string gmail_message_rfc3339_time = 4;
  OpenedGmailMessageHeaders gmail_message_headers = 5;
  repeated string gmail_label_names = 6;
  bool gmail_message_is_unread = 7;
  repeated OpenedGmailMessageAttachment gmail_message_attachments = 8;
  string gmail_message_body_text = 9;
  bool gmail_message_body_text_is_truncated = 10;
  optional int64 omitted_gmail_message_body_character_count = 11;
}

message OpenedGmailMessageHeaders {
  optional string sender_display_name = 1;
  optional string sender_email_address = 2;
  string recipient_email_addresses = 3;
  optional string copied_recipient_email_addresses = 4;
  string gmail_message_subject = 5;
}

message OpenedGmailMessageAttachment {
  string attachment_filename = 1;
  string attachment_media_type = 2;
  int64 attachment_byte_count = 3;
}
