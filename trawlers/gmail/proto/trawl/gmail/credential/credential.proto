syntax = "proto3";

package trawl.gmail.credential;

option go_package = "github.com/opentrawl/opentrawl/gmail/proto/trawl/gmail/credential;gmailcredential";

// The Google grant OpenTrawl keeps in the macOS Data Protection Keychain.
// The refresh token is bound by DPoP to a Secure Enclave key on this Mac.
message StoredGmailGoogleOAuthCredential {
  string google_oauth_refresh_token = 1;
  string latest_google_dpop_nonce = 2;
}
