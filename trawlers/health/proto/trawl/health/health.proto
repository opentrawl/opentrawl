// Written by AI on 2026.11.23 by model gemini-4-neon.
// Input and stored archive records for the Apple Health and HealthFit trawler.
// Supports generalized iPhone HealthKit drop-and-replay batches, full Apple
// Health export.zip/export.xml archives (all Record, Workout, Correlation,
// ActivitySummary, Electrocardiogram, Audiogram, ClinicalRecord, and GPX route
// entries), and HealthFit .fit workout files.
syntax = "proto3";
package trawl.health;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlers/health/proto/trawl/health;health";

// HealthKitExportBatch is one immutable export batch from a device or import
// tool. Its JSON form is accepted by POST /api/v1/ingest/health and its
// prototext or JSON form can be dropped into <stateRoot>/health/imports/.
message HealthKitExportBatch {
  google.protobuf.Timestamp exported_at = 1;
  string device_name = 2;
  repeated HealthWorkout workouts = 3;
  repeated HealthSleepSession sleep_sessions = 4;
  repeated HealthDailyMetrics daily_metrics = 5;
  repeated HealthSample samples = 6;
  repeated HealthCorrelation correlations = 7;
  repeated HealthActivitySummary activity_summaries = 8;
  repeated HealthElectrocardiogram electrocardiograms = 9;
  repeated HealthAudiogram audiograms = 10;
  repeated HealthClinicalRecord clinical_records = 11;
}

// HealthMetadataEntry preserves one key-value HealthKit metadata attribute.
message HealthMetadataEntry {
  string key = 1;
  string value = 2;
}

// HealthSample is one observed HealthKit quantity or category record
// (HKQuantityTypeIdentifier* or HKCategoryTypeIdentifier*).
message HealthSample {
  // HKObject.uuid when present; empty for Apple Health XML rows where the
  // archive derives a deterministic content hash.
  string healthkit_sample_uuid = 1;
  // Exact HealthKit type identifier such as HKQuantityTypeIdentifierHeartRate.
  string healthkit_type_identifier = 2;
  string unit = 3;
  // Exact observed value string (numeric text or HKCategoryValue* enum name).
  string raw_value = 4;
  optional double numeric_value = 5;
  string source_name = 6;
  string source_version = 7;
  string device = 8;
  google.protobuf.Timestamp start_time = 9;
  google.protobuf.Timestamp end_time = 10;
  google.protobuf.Timestamp creation_time = 11;
  int32 utc_offset_seconds = 12;
  string calendar_date = 13;
  repeated HealthMetadataEntry metadata_entries = 14;
}

// HealthWorkoutStatistic preserves one Apple Health <WorkoutStatistics> entry
// or derived FIT session metric.
message HealthWorkoutStatistic {
  string quantity_type_identifier = 1;
  string unit = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  optional double sum_value = 5;
  optional double average_value = 6;
  optional double minimum_value = 7;
  optional double maximum_value = 8;
}

// HealthWorkoutEvent preserves one pause, resume, lap, or segment event.
message HealthWorkoutEvent {
  string event_type = 1;
  google.protobuf.Timestamp event_time = 2;
  optional double duration_seconds = 3;
  repeated HealthMetadataEntry metadata_entries = 4;
}

// HealthWorkoutRouteSummary summarizes a linked GPX or FIT GPS track without
// duplicating thousands of raw coordinates into the search index.
message HealthWorkoutRouteSummary {
  string route_file_reference = 1;
  int32 point_count = 2;
  optional double start_latitude = 3;
  optional double start_longitude = 4;
  optional double end_latitude = 5;
  optional double end_longitude = 6;
  optional double min_latitude = 7;
  optional double max_latitude = 8;
  optional double min_longitude = 9;
  optional double max_longitude = 10;
  optional double total_elevation_gain_meters = 11;
  optional double total_elevation_loss_meters = 12;
}

// HealthWorkoutSourceProvenance records each contributing source when an
// Apple Health workout and a HealthFit .fit workout are deduplicated together.
message HealthWorkoutSourceProvenance {
  // Canonical origin kind: "healthkit_batch", "apple_health_xml", or "healthfit_fit".
  string source_kind = 1;
  string source_name = 2;
  string source_identifier = 3;
  string imported_file_name = 4;
}

// HealthWorkout is one workout from HealthKit, Apple Health XML, or HealthFit .fit.
message HealthWorkout {
  // HKObject.uuid or deterministic workout identifier.
  string healthkit_sample_uuid = 1;
  // Canonical HKWorkoutActivityType case name, such as "running" or "cycling".
  string healthkit_workout_activity_type_name = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  double duration_seconds = 5;
  optional double total_energy_burned_kilocalories = 6;
  optional double total_distance_meters = 7;
  optional double average_heart_rate_beats_per_minute = 8;
  // HKSource.name or FIT device/manufacturer name.
  string source_name = 9;
  string source_version = 10;
  string device = 11;
  google.protobuf.Timestamp creation_time = 12;
  int32 utc_offset_seconds = 13;
  repeated HealthMetadataEntry metadata_entries = 14;
  repeated HealthWorkoutStatistic statistics = 15;
  repeated HealthWorkoutEvent events = 16;
  HealthWorkoutRouteSummary route_summary = 17;
  repeated HealthWorkoutSourceProvenance contributing_sources = 18;
  string sport_sub_type = 19;
  optional double max_heart_rate_beats_per_minute = 20;
  optional double total_ascent_meters = 21;
  optional double average_power_watts = 22;
  optional double average_cadence = 23;
  optional double average_speed_meters_per_second = 24;
}

enum HealthSleepStage {
  HEALTH_SLEEP_STAGE_UNSPECIFIED = 0;
  HEALTH_SLEEP_STAGE_IN_BED = 1;
  HEALTH_SLEEP_STAGE_ASLEEP_UNSPECIFIED = 2;
  HEALTH_SLEEP_STAGE_AWAKE = 3;
  HEALTH_SLEEP_STAGE_ASLEEP_CORE = 4;
  HEALTH_SLEEP_STAGE_ASLEEP_DEEP = 5;
  HEALTH_SLEEP_STAGE_ASLEEP_REM = 6;
}

// HealthSleepSession is one HKCategorySample of sleepAnalysis.
message HealthSleepSession {
  string healthkit_sample_uuid = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  HealthSleepStage sleep_stage = 4;
  string source_name = 5;
  string source_version = 6;
  string device = 7;
  int32 utc_offset_seconds = 8;
}

// HealthDailyMetrics are HKStatistics totals or averages for one local day.
// A later export of the same day replaces only the fields it sets.
message HealthDailyMetrics {
  // The local calendar day, YYYY-MM-DD.
  string calendar_date = 1;
  optional int64 step_count = 2;
  optional double active_energy_burned_kilocalories = 3;
  optional double exercise_minutes = 4;
  optional double walking_running_distance_meters = 5;
  optional int64 flights_climbed = 6;
  optional double resting_heart_rate_beats_per_minute = 7;
  optional double heart_rate_variability_sdnn_milliseconds = 8;
}

// HealthCorrelation is one Apple Health <Correlation> (such as blood pressure
// or nutrition) together with its component samples.
message HealthCorrelation {
  string reference_identifier = 1;
  string correlation_type_identifier = 2;
  string source_name = 3;
  string source_version = 4;
  string device = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  google.protobuf.Timestamp creation_time = 8;
  int32 utc_offset_seconds = 9;
  repeated HealthMetadataEntry metadata_entries = 10;
  repeated HealthSample component_samples = 11;
}

// HealthActivitySummary is one Apple Watch daily Activity ring summary.
message HealthActivitySummary {
  // The local calendar day, YYYY-MM-DD.
  string calendar_date = 1;
  optional double active_energy_burned_kilocalories = 2;
  optional double active_energy_burned_goal_kilocalories = 3;
  optional double apple_move_time_minutes = 4;
  optional double apple_move_time_goal_minutes = 5;
  optional double apple_exercise_time_minutes = 6;
  optional double apple_exercise_time_goal_minutes = 7;
  optional double apple_stand_hours = 8;
  optional double apple_stand_hours_goal = 9;
}

// HealthElectrocardiogram preserves an Apple Watch ECG classification and
// waveform file metadata without flooding the index with raw microvolt rows.
message HealthElectrocardiogram {
  string reference_identifier = 1;
  string classification = 2;
  optional double average_heart_rate_beats_per_minute = 3;
  optional double sampling_frequency_hertz = 4;
  int32 voltage_measurement_count = 5;
  string symptoms_status = 6;
  string source_name = 7;
  string source_version = 8;
  string device = 9;
  google.protobuf.Timestamp recorded_time = 10;
  int32 utc_offset_seconds = 11;
  string csv_file_reference = 12;
  repeated HealthMetadataEntry metadata_entries = 13;
}

// HealthAudiogramSensitivityPoint records hearing thresholds at one frequency.
message HealthAudiogramSensitivityPoint {
  double frequency_hertz = 1;
  optional double left_ear_decibels_hl = 2;
  optional double right_ear_decibels_hl = 3;
}

// HealthAudiogram is one Apple Health <Audiogram> hearing test.
message HealthAudiogram {
  string reference_identifier = 1;
  string source_name = 2;
  string source_version = 3;
  string device = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  google.protobuf.Timestamp creation_time = 7;
  int32 utc_offset_seconds = 8;
  repeated HealthAudiogramSensitivityPoint sensitivity_points = 9;
  repeated HealthMetadataEntry metadata_entries = 10;
}

// HealthClinicalRecord is one Apple Health FHIR clinical record.
message HealthClinicalRecord {
  string reference_identifier = 1;
  string clinical_type_identifier = 2;
  string display_name = 3;
  string source_name = 4;
  string source_url = 5;
  string fhir_version = 6;
  string resource_file_reference = 7;
  string fhir_resource_json = 8;
  google.protobuf.Timestamp recorded_time = 9;
  int32 utc_offset_seconds = 10;
}
