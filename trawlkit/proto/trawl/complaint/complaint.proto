syntax = "proto3";

package trawl.complaint;

import "google/protobuf/timestamp.proto";
import "trawl/identity/identity.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/complaint;complaint";

// What an agent or a person found hard to use or hard to read in OpenTrawl.
// It stays on this computer, in the state root's complaints folder, one text
// protobuf file each, for the owner to read with trawl complaints.
message TrawlComplaint {
  google.protobuf.Timestamp complaint_time = 1;
  string complaint_text = 2;
  // The trawl command whose output or behaviour the complaint is about, as
  // the complainer typed it.
  string trawl_command_complained_about = 3;
  // The agent conversation the complaint came from, as the Agents trawler
  // archives it, so trawl open shows it. Unset when the complaint did not
  // come from a known agent harness.
  trawl.identity.CanonicalArchiveRecordReference complaining_agent_conversation_reference = 4;
}

message ListedTrawlComplaint {
  TrawlComplaint trawl_complaint = 1;
  // The link trawl open accepts for the complaining conversation, once the
  // Agents archive holds it.
  trawl.identity.GloballyRoutableTrawlLink complaining_agent_conversation_trawl_link = 2;
}

message TrawlComplaintListResponse {
  repeated ListedTrawlComplaint listed_trawl_complaints_newest_first = 1;
  uint64 total_trawl_complaint_count = 2;
}
