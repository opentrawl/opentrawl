syntax = "proto3";

package trawl.sync.v1;

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/sync/v1;syncv1";

message TrawlerArchiveSyncReport {
  optional uint64 archive_record_count_added_by_this_sync = 1;
  optional uint64 archive_record_count_updated_by_this_sync = 2;
  optional uint64 archive_record_count_removed_by_this_sync = 3;
}
