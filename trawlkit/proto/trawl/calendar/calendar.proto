syntax = "proto3";

package trawl.calendar;

import "trawl/identity/identity.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/calendar;calendar";

message CalendarRecord {
  trawl.identity.CanonicalArchiveRecordReference canonical_record_reference = 1;
  string calendar_display_name = 2;
  string calendar_account_display_name = 3;
  string human_entered_calendar_owner_or_purpose_description = 4;
  uint64 active_or_future_calendar_event_count = 5;
}

message CalendarListResponse {
  repeated CalendarRecord calendar_records_in_display_order = 1;
}
