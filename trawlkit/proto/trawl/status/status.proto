syntax = "proto3";

package trawl.status;

import "google/protobuf/timestamp.proto";
import "trawl/photos/step/photos_step.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/status;status";

message ArchiveContentCountAfterLastSuccessfullyCompletedUpdate {
  string archive_content_kind_name = 1;
  string archive_content_kind_display_name = 2;
  uint64 archive_content_count = 3;
}

enum SourceAppSyncLiveness {
  SOURCE_APP_SYNC_LIVENESS_UNSPECIFIED = 0;
  SOURCE_APP_SYNC_LIVENESS_NOT_APPLICABLE = 1;
  SOURCE_APP_SYNC_LIVENESS_SOURCE_APP_RUNNING = 2;
  SOURCE_APP_SYNC_LIVENESS_SOURCE_APP_NOT_RUNNING = 3;
}

enum ArchiveLiveSyncCredentialStatus {
  ARCHIVE_LIVE_SYNC_CREDENTIAL_STATUS_UNSPECIFIED = 0;
  ARCHIVE_LIVE_SYNC_CREDENTIAL_STATUS_NOT_APPLICABLE = 1;
  ARCHIVE_LIVE_SYNC_CREDENTIAL_STATUS_AVAILABLE = 2;
  ARCHIVE_LIVE_SYNC_CREDENTIAL_STATUS_REQUIRES_SIGNED_APP = 3;
  ARCHIVE_LIVE_SYNC_CREDENTIAL_STATUS_NOT_CONNECTED = 4;
}

message ArchiveMonthlyRecordCount {
  uint32 calendar_year = 1;
  uint32 calendar_month = 2;
  uint64 record_count = 3;
}

message ArchiveMonthlyHistory {
  google.protobuf.Timestamp oldest_archived_record_time = 1;
  repeated ArchiveMonthlyRecordCount monthly_record_counts_in_chronological_order = 2;
  uint64 undated_record_count = 3;
}

message TrawlerArchiveStatus {
  repeated ArchiveContentCountAfterLastSuccessfullyCompletedUpdate archive_content_counts_after_last_successfully_completed_update = 1;
  google.protobuf.Timestamp last_successfully_completed_archive_update_time = 2;
  bool trawler_archive_can_answer_current_commands = 3;
  google.protobuf.Timestamp newest_archived_record_time = 4;
  SourceAppSyncLiveness source_app_sync_liveness = 5;
  ArchiveLiveSyncCredentialStatus archive_live_sync_credential_status = 6;
  ArchiveMonthlyHistory archive_monthly_history = 7;
}

message TrawlerStatusResponse {
  TrawlerArchiveStatus trawler_archive_status = 1;
  trawl.photos.step.PhotosPipelineStatus photos_pipeline_status = 2;
}
