syntax = "proto3";

package trawl.conversation;

import "google/protobuf/timestamp.proto";
import "trawl/identity/identity.proto";
import "trawl/person/person.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/conversation;conversation";

message ConversationParticipantIdentityObservedByTrawlerArchive {
  string person_display_name = 1;
  repeated trawl.person.ExactPersonFilterIdentifier exact_person_filter_identifiers_observed_by_trawler_archive = 2;
}

message ConversationRecord {
  trawl.identity.CanonicalArchiveRecordReference canonical_record_reference = 1;
  string conversation_display_name = 2;
  repeated ConversationParticipantIdentityObservedByTrawlerArchive conversation_participant_identities_observed_by_trawler_archive = 3;
  google.protobuf.Timestamp most_recent_conversation_activity_time = 4;
  optional uint64 unread_message_count = 5;
  optional uint64 number_of_distinct_conversation_participant_records_observed_by_trawler_archive = 6;
}

message ConversationListResponse {
  repeated ConversationRecord conversation_records_newest_first = 1;
  bool more_conversation_records_exist = 2;
}

message ConversationParticipantForCompleteConversationParticipantList {
  string person_display_name = 1;
  trawl.identity.GloballyRoutableTrawlLink person_trawl_link_resolved_across_trawler_archives = 2;
}

message ConversationParticipantListResponse {
  repeated ConversationParticipantForCompleteConversationParticipantList conversation_participants_in_alphabetical_order = 1;
  uint64 number_of_distinct_conversation_participant_records_observed_by_trawler_archive = 2;
}
