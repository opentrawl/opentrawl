syntax = "proto3";

package trawl.command;

import "trawl/calendar_event/calendar_event.proto";
import "trawl/calendar/calendar.proto";
import "trawl/conversation/conversation.proto";
import "trawl/message/message.proto";
import "trawl/note/note.proto";
import "trawl/person/person.proto";
import "trawl/photos/step/photos_step.proto";
import "trawl/photo/photo.proto";
import "trawl/presentation/presentation.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/command;command";

message TrawlerSpecificCommandResponse {
  oneof trawler_specific_command_presentation {
    trawl.presentation.TrawlerSpecificCommandListPresentation trawler_specific_command_list_presentation = 1;
    trawl.presentation.TrawlerSpecificCommandDetailPresentation trawler_specific_command_detail_presentation = 2;
  }
}

enum AccountConnectionChangeKind {
  ACCOUNT_CONNECTION_CHANGE_KIND_UNSPECIFIED = 0;
  ACCOUNT_CONNECTION_CHANGE_KIND_CONNECTED = 1;
  ACCOUNT_CONNECTION_CHANGE_KIND_DISCONNECTED = 2;
}

message AccountConnectionChangeResponse {
  AccountConnectionChangeKind account_connection_change_kind = 1;
  string trawler_command_name = 2;
  string trawler_display_name = 3;
  string account_provider_display_name = 4;
  string connected_account_identifier = 5;
  bool local_archive_kept_on_mac = 6;
  bool connect_command_requires_arguments = 7;
}

message TrawlerCommandResponse {
  oneof typed_trawler_command_response {
    trawl.message.MessageListResponse message_list_response = 1;
    trawl.conversation.ConversationListResponse conversation_list_response = 2;
    trawl.person.PersonListResponse person_list_response = 3;
    trawl.person.PersonRecord person_record = 4;
    trawl.calendar_event.CalendarEventListResponse calendar_event_list_response = 5;
    TrawlerSpecificCommandResponse trawler_specific_command_response = 6;
    trawl.note.NoteListResponse note_list_response = 7;
    trawl.note.NoteFolderListResponse note_folder_list_response = 8;
    trawl.note.RecoveredNoteVersionListResponse recovered_note_version_list_response = 9;
    trawl.calendar.CalendarListResponse calendar_list_response = 10;
    trawl.photos.step.PhotosStepRunResponse photos_step_run_response = 11;
    trawl.photo.PhotoListResponse photo_list_response = 12;
    trawl.photo.PhotoLocalDayListResponse photo_local_day_list_response = 13;
    trawl.photo.PhotoInspectionResponse photo_inspection_response = 14;
    AccountConnectionChangeResponse account_connection_change_response = 17;
  }
}
