syntax = "proto3";

package trawl.email;

import "google/protobuf/timestamp.proto";
import "trawl/identity/identity.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/email;email";

message OpenedEmailMessageRecord {
  trawl.identity.CanonicalArchiveRecordReference canonical_email_message_record_reference = 1;
  google.protobuf.Timestamp email_message_time = 2;
  OpenedEmailMessageHeaders email_message_headers = 3;
  bool email_message_is_unread = 4;
  repeated OpenedEmailMessageAttachment email_message_attachments = 5;
  string email_message_body_text = 6;
  google.protobuf.Timestamp deleted_from_email_source_time = 7;
  oneof email_source_details {
    GmailEmailSourceDetails gmail_email_source_details = 8;
    AppleMailEmailSourceDetails apple_mail_email_source_details = 9;
  }
}

message OpenedEmailMessageHeaders {
  optional string sender_display_name = 1;
  optional string sender_email_address = 2;
  string recipient_email_addresses = 3;
  optional string copied_recipient_email_addresses = 4;
  optional string reply_to_email_addresses = 5;
  optional string mailing_list_identifier = 6;
  optional string rfc5322_message_identifier = 7;
  optional string in_reply_to_message_identifiers = 8;
  string email_subject = 9;
}

message OpenedEmailMessageAttachment {
  string attachment_filename = 1;
  string attachment_media_type = 2;
  optional int64 attachment_byte_count = 3;
}

message GmailEmailSourceDetails {
  string gmail_message_identifier = 1;
  string gmail_thread_identifier = 2;
  repeated string gmail_label_names = 3;
}

message AppleMailEmailSourceDetails {
  string apple_mail_account_display_name = 1;
  string apple_mail_mailbox_name = 2;
}
