syntax = "proto3";

package trawl.app.v1;

import "trawl/federation/v1/federation.proto";

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/app/v1;appv1";

enum ArchiveBuildPhase {
  ARCHIVE_BUILD_PHASE_UNSPECIFIED = 0;
  ARCHIVE_BUILD_PHASE_BUILDING = 1;
  ARCHIVE_BUILD_PHASE_FINALISING = 2;
}

message SyncProgress {
  string registered_trawler_manifest_identity = 1;
  ArchiveBuildPhase phase = 2;
}

message SyncEvent {
  oneof kind {
    SyncProgress progress = 1;
    trawl.federation.v1.FederatedTrawlerArchiveSyncOperation result = 2;
  }
}
